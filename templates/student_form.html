{% extends "base.html" %}{% block title %}{{ 'Edit' if student else 'Add' }} Student | StudentTrack{% endblock %}{% block content %}
<div class="topbar"><div><p class="eyebrow">STUDENT MANAGEMENT</p><h1>{{ 'Edit student' if student else 'Add student' }}</h1><p class="muted">Enter the student's details below.</p></div><a href="{{ url_for('students') }}" class="btn secondary">← Back</a></div>
<section class="panel form-panel"><form method="post" class="form-grid">
<div><label>Roll number *</label><input name="roll_no" value="{{ student.roll_no if student else '' }}" required placeholder="e.g. BCA001"></div>
<div><label>Full name *</label><input name="name" value="{{ student.name if student else '' }}" required placeholder="Student name"></div>
<div><label>Email</label><input type="email" name="email" value="{{ student.email if student else '' }}" placeholder="student@example.com"></div>
<div><label>Class / Section *</label><input name="class_name" value="{{ student.class_name if student else '' }}" required placeholder="e.g. BCA - 1"></div>
<div class="form-actions"><button class="btn primary">Save student</button><a class="btn secondary" href="{{ url_for('students') }}">Cancel</a></div>
</form></section>{% endblock %}
